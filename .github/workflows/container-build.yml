name: Container build

on:
  pull_request:
    paths:
      - Dockerfile
      - pyproject.toml
      - uv.lock
      - strix/**
      - .github/workflows/container-build.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - name: Build and verify the standalone runtime
        run: docker build --tag strix-runtime:ci .
